[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bb-mask"
version = "0.1.0"
description = "bb_mask istemcisi. anonymize ve restore; model çağrısı yok."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = ["httpx>=0.27.0"]

[tool.setuptools.packages.find]
include = ["bb_mask*"]
